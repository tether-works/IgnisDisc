ShortDescription: Free, open-source CD/DVD burner, audio CD ripper with AccurateRip, and multi-disc archiver for Windows.
Description: |-
  IgnisDisc burns data discs, ISO images, DVD-Video discs and audio CDs, rips audio CDs to WAV, FLAC, MP3, Opus or AAC with AccurateRip verification (FLAC, MP3 and Opus ripping use the optional ffmpeg download), and archives large folders across several discs with SHA-256 manifests and optional PAR2 recovery data.
  It also burns albums from .cue sheets and playlists, copies discs, makes bootable BIOS + UEFI discs, and burns or converts Nero, Alcohol 120%, CloneCD and DiscJuggler (.cdi) images. It includes a desktop app and a command-line tool (ignisdisc-cli).
  Data discs, single-layer DVDs and the command line use Windows' built-in burning service (IMAPIv2) by default. An experimental writer that sends drive commands itself is on by default in the app for audio CDs (when the drive offers Session-at-Once) and dual-layer DVD-Video, and opt-in elsewhere; it adds CD-Text, ISRC codes, test writes, dual-layer layer-break placement and sessions added to open discs. It has been tried on one drive model so far, and every burn it makes is read back and compared.
